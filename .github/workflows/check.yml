name: Verify local prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: usc
          POSTGRES_PASSWORD: usc
          POSTGRES_DB: usc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U usc -d usc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://usc:usc@127.0.0.1:5432/usc_test
